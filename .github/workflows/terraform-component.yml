# Plan (PR) e apply (push) de UMA pasta do database-infra. Cada pasta tem
# workspace HCP e state próprios: aplicar um banco não altera os outros.
name: Terraform component

on:
  workflow_call:
    inputs:
      component:
        description: Pasta do componente (os, orcamento-pagamento ou diagnostico-reparo)
        required: true
        type: string
      workspace_key:
        description: Chave das variáveis TF_WORKSPACE_<KEY>_<AMBIENTE>
        required: true
        type: string
      sync_os_outputs:
        description: Sincroniza JDBC do OS com Auth e OS Service após o apply
        required: false
        type: boolean
        default: false

jobs:
  plan:
    name: Plan ${{ inputs.component }} (${{ github.base_ref == 'main' && 'production' || 'homolog' }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'production-plan' || 'homolog-plan' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.component }}
    env:
      TARGET_ENVIRONMENT: ${{ github.base_ref == 'main' && 'production' || 'homolog' }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ github.base_ref == 'main' && vars[format('TF_WORKSPACE_{0}_PRODUCTION', inputs.workspace_key)] || vars[format('TF_WORKSPACE_{0}_HOMOLOG', inputs.workspace_key)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Validate HCP configuration
        run: |
          set -euo pipefail
          test -n "$TF_CLOUD_ORGANIZATION" || { echo "::error::TF_CLOUD_ORGANIZATION não configurada no ambiente de plan."; exit 1; }
          test -n "$TF_WORKSPACE" || { echo "::error::Workspace HCP de ${{ inputs.component }} ($TARGET_ENVIRONMENT) não configurado. Rode o configure-environment.ps1."; exit 1; }

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        run: terraform plan -input=false -no-color

      - name: Summary
        run: |
          {
            echo "## Plan de ${{ inputs.component }} em ${TARGET_ENVIRONMENT}"
            echo
            echo "- workspace: \`${TF_WORKSPACE}\`"
            echo "- nenhum apply executado"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply ${{ inputs.component }} (${{ github.ref_name == 'main' && 'production' || 'homolog' }})
    if: github.event_name != 'pull_request' && (github.ref_name == 'homolog' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.component }}
    env:
      TARGET_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ github.ref_name == 'main' && vars[format('TF_WORKSPACE_{0}_PRODUCTION', inputs.workspace_key)] || vars[format('TF_WORKSPACE_{0}_HOMOLOG', inputs.workspace_key)] }}
      ENABLE_TERRAFORM_APPLY: ${{ vars.ENABLE_TERRAFORM_APPLY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          GITHUB_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          SYNC_APP_CLIENT_ID: ${{ vars.SYNC_APP_CLIENT_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          SYNC_OS_OUTPUTS: ${{ inputs.sync_os_outputs }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_TERRAFORM_APPLY" != "true" ]; then
            echo "::error::ENABLE_TERRAFORM_APPLY deve valer true no ambiente ${TARGET_ENVIRONMENT}."
            exit 1
          fi
          missing=()
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TF_CLOUD_ORGANIZATION TF_WORKSPACE TF_API_TOKEN; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "$SYNC_OS_OUTPUTS" = "true" ] && [ -z "$GITHUB_SYNC_TOKEN" ] && { [ -z "$SYNC_APP_CLIENT_ID" ] || [ -z "$SYNC_APP_PRIVATE_KEY" ]; }; then
            missing+=("REPO_SYNC_TOKEN ou SYNC_APP_CLIENT_ID+SYNC_APP_PRIVATE_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Configuração de deploy incompleta: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Validate AWS Academy session
        run: |
          aws sts get-caller-identity >/dev/null
          echo "Sessão AWS válida."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: Adopt existing telemetry log group
        if: inputs.component == 'os'
        run: |
          set -euo pipefail
          resource_address='aws_cloudwatch_log_group.rds_telemetry["enabled"]'
          log_group_name="/aws/lambda/oficina-${TARGET_ENVIRONMENT}-os-rds-newrelic-telemetry"

          if terraform state show "$resource_address" >/dev/null 2>&1; then
            echo "Log Group já gerenciado pelo Terraform."
            exit 0
          fi

          if ! aws logs describe-log-groups \
            --region "$AWS_REGION" \
            --log-group-name-prefix "$log_group_name" \
            --no-paginate \
            --query 'logGroups[].logGroupName' \
            --output text | tr '\t' '\n' | grep -Fxq "$log_group_name"; then
            echo "Log Group não existe; o Terraform irá criá-lo."
            exit 0
          fi

          cat > existing-rds-telemetry-log-group.auto.tf <<EOF
          import {
            to = aws_cloudwatch_log_group.rds_telemetry["enabled"]
            id = "$log_group_name"
          }
          EOF

          echo "Log Group existente será importado pelo Terraform."

      - name: Terraform plan
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color

      - name: Generate GitHub App synchronization token
        id: sync-app-token
        if: inputs.sync_os_outputs && vars.SYNC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: oficina-os-service

      - name: Sincronizar JDBC com Auth e OS Service
        if: inputs.sync_os_outputs
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          GITHUB_SYNC_TOKEN: ${{ steps.sync-app-token.outputs.token || secrets.REPO_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          terraform output -json > "$RUNNER_TEMP/database-outputs.json"
          python3 ../scripts/sync-database-outputs.py \
            --outputs-file "$RUNNER_TEMP/database-outputs.json" \
            --organization "$TF_CLOUD_ORGANIZATION" \
            --auth-workspace "oficina-fase4-auth-${TARGET_ENVIRONMENT}" \
            --environment "$TARGET_ENVIRONMENT"
          echo "- JDBC sincronizado com Auth e OS Service" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform outputs
        run: terraform output -no-color

      - name: Summary
        run: |
          {
            echo "## ${{ inputs.component }} aplicado em ${TARGET_ENVIRONMENT}"
            echo
            echo "- workspace: \`${TF_WORKSPACE}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- filas, tabela e JDBC dos serviços: rode novamente o configure-environment.ps1"
          } >> "$GITHUB_STEP_SUMMARY"
